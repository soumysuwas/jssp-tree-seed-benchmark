[project]
name = "jssp-tree-seed-benchmark"
version = "1.0.0"
description = "Independent reproduction of the ATSA (Sahman 2022) and DTSA (Cinar 2020) tree-seed algorithms on the Taillard job-shop scheduling benchmark"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26,<2.2",
    "numba>=0.60,<0.68",    # JITs the ATSA hot loops (~69x); optional at runtime, see src/atsa_jssp/_compat.py
    "joblib>=1.4",          # process-parallel across runs
    "pandas>=2.2",
    "typer>=0.12",          # CLI
    "rich>=13.7",           # CLI output
]

[project.scripts]
atsa = "atsa_jssp.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atsa_jssp"]

[tool.pytest.ini_options]
testpaths = ["tests", "dtsa/tests"]
pythonpath = ["src", "reference", "dtsa", "dtsa/validation_tsp"]
addopts = "-q"
markers = ["slow: long-running; deselect with -m 'not slow'"]

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]
